<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sun_ub🌌</title>
  <!-- Critical CSS: 초기 렌더링 시 즉시 스타일 적용을 위해 HTML에서 직접 로드 -->
  <link rel="stylesheet" href="./src/style.css" />
  <link rel="stylesheet" href="./src/title.css" />
  <link rel="stylesheet" href="./src/button.css" />
  <link rel="stylesheet" href="./src/loadingIndicator.css" />
  <link rel="stylesheet" href="./src/toastMessage.css" />
  <link rel="stylesheet" href="./src/audio.css" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=rocket_launch" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&amp;family=Inter:wght@300;400;600&amp;family=Material+Icons+Outlined&amp;display=swap"
    rel="stylesheet" />
</head>

<body>
  <div class="root">
    <canvas class="canvas"></canvas>
  </div>
  <div class="entry-screen">
    <div class="orb-container">
      <div class="orb-surface">
        <div class="orb-highlight"></div>
        <h1 class="orb-title">SUNUB</h1>
        <div class="orb-meta-wrapper">
          <p class="orb-subtitle">Portfolio</p>
          <div class="orb-divider"></div>
          <p class="orb-date">Est. 2026</p>
        </div>
        <div class="orb-shadow"></div>
      </div>
    </div>
    <div class="entry-screen-content">
      <main id="loading-zone" aria-busy="true" class="loading-box">

        <div class="loading-info">
          <p id="loading-txt" class="loading-text">Preparing...</p>
          <span id="loading-percentage" class="loading-percentage">0%</span>
        </div>

        <div class="loading-container">
          <span id="loading-label" class="sr-only">Loading progress</span>

          <progress id="game-loader" value="0" max="100" aria-labelledby="loading-txt" tabindex="-1">
            0%
          </progress>
        </div>

        <div class="assets-loaded-text">
          <span id="assets-remaining-label">Assets Remaining: 0</span>
          <span id="assets-loaded-count" style="font-family: monospace; margin-left: auto;">0/0</span>
        </div>

      </main>
      <button id="entry-button" class="enter-btn" disabled>
        <div class="enter-btn__glass"></div>
        <div class="enter-btn__glow"></div>
        <span class="enter-btn__text">
          Enter
        </span>
        <div class="enter-btn__border"></div>
      </button>
    </div>

  </div>
  <div class="audio-panel">
    <button class="mute-btn">
      <span class="material-symbols-outlined">volume_up</span>
    </button>

    <div class="slider-wrapper">
      <div class="wave-origin" id="wave-origin" style="left: 70%;">
        <div class="wave-circle wave-1"></div>
        <div class="wave-circle wave-2"></div>
        <div class="wave-circle wave-3"></div>
        <div class="wave-circle wave-4"></div>
      </div>
      <input type="range" class="volume-input" min="0" max="100" value="70">
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
